<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e9dfcf"><meta name="description" content="Three.js 자동차 주행 게임. WASD 또는 방향키로 조작하세요."><title>DUST / DRIVE</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"></head>
<body>
<main id="game" aria-label="3D 자동차 주행 게임">
  <canvas id="scene" aria-label="자동차와 사막 서킷"></canvas>
  <header><div class="brand">DUST<span>/ DRIVE</span><small>DESERT CIRCUIT</small></div><div class="actions"><button id="camera" title="C: 카메라 변경">카메라 <span>C</span></button><button id="reset" title="R: 처음부터">리셋 <span>R</span></button><button id="pause" title="P: 일시정지" aria-pressed="false">일시정지 <span>P</span></button></div></header>
  <section class="timing" aria-label="주행 기록"><div><small>LAP</small><strong id="lap">01</strong></div><div><small>TIME</small><strong id="time">00:00.00</strong></div><div><small>BEST</small><strong id="best">—</strong></div></section>
  <div id="notice" role="status">시계 방향으로 한 바퀴를 완주하세요</div>
  <div class="bottom"><div class="controls"><span><kbd>W</kbd><kbd>↑</kbd> 가속</span><span><kbd>S</kbd><kbd>↓</kbd> 브레이크 / 후진</span><span><kbd>A</kbd><kbd>D</kbd> 조향</span><span><kbd>SPACE</kbd> 핸드브레이크</span></div><div class="speed"><div><strong id="speed">0</strong><span>KM/H</span></div><div class="speed-track"><i id="speed-bar"></i></div><small id="gear">N <span>REAR WHEEL DRIVE</span></small></div></div>
  <div class="touch-controls"><div><button data-control="left" aria-label="좌회전">◀</button><button data-control="right" aria-label="우회전">▶</button></div><div><button data-control="brake" class="brake" aria-label="브레이크 및 후진">BRAKE</button><button data-control="gas" class="gas" aria-label="가속">GAS</button></div></div>
  <div id="overlay" class="overlay"><div><p>DUST / DRIVE</p><h1 id="overlay-title">로딩 중</h1><p id="overlay-text">3D 장면을 준비하고 있습니다.</p><button id="resume" hidden>계속하기</button></div></div>
</main><script type="module" src="game.js"></script></body></html>
